<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Choir — a toy swarm</title>
    <meta name="description" content="An interactive 3D metaphor for emergent coherence in a peer-to-peer swarm of software agents. Not a scientific claim." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="./styles/global.css" />
  </head>
  <body>
    <canvas id="three"></canvas>
    <div id="hud" aria-live="polite">
      <div class="row"><span class="label">coherence</span><span class="val coherence" id="hud-coherence">0.00</span></div>
      <div class="row"><span class="label">peers</span><span class="val" id="hud-peers">0</span></div>
      <div class="row"><span class="label">fps</span><span class="val" id="hud-fps">—</span></div>
      <div class="row mode-row">
        <span class="label">mode</span>
        <span class="mode-group">
          <button type="button" id="hud-mode-local" class="mode-btn">local</button>
          <button type="button" id="hud-mode-live" class="mode-btn">live</button>
        </span>
      </div>
      <div class="note" id="hud-note" role="status"></div>
    </div>
    <div id="caption"></div>
    <script type="module" src="./app/main.ts"></script>
  </body>
</html>
